name: Runtime flow audit

on:
  push:
    branches:
      - agent/runtime-flow-audit-20260805

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-flow-audit-20260805
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run focused flow regressions
        run: |
          python -m pytest -q \
            tests/test_runtime_loop_closure.py \
            tests/test_phase7_runtime_convergence.py

      - name: Simulate one complete game turn
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import json
          import runpy
          import tempfile
          from pathlib import Path

          from civ6_workflow.domain import ApprovalDecision
          from civ6_workflow.models import (
              ActionResult,
              ExecutionMode,
              MutationDeliveryStatus,
          )

          helpers = runpy.run_path("tests/test_strategic_research_proposals.py")

          async def scenario():
              root = Path(tempfile.mkdtemp(prefix="civ6-runtime-audit-"))
              store, request, proposal, provider_attempt = await helpers[
                  "_completed_proposal_state"
              ](root / "audit.sqlite3")
              store = helpers["_dormant_store"](store)
              applied = store.approve_strategic_research_proposal(
                  proposal.game_session_id,
                  helpers["_proposal_decision"](
                      store,
                      proposal,
                      ApprovalDecision.APPROVED,
                      suffix="runtime-audit",
                      actor="runtime-audit",
                  ),
              )

              class SimulatedGame(helpers["_Game"]):
                  def __init__(self, game_id):
                      super().__init__(game_id)
                      self.mutations = []

                  async def execute_task(self, task):
                      self.call_count += 1
                      self.mutations.append(
                          {
                              "kind": "task",
                              "action_type": task.action_type,
                              "arguments": dict(task.arguments),
                          }
                      )
                      assert task.action_type == "set_research"
                      assert task.arguments == {"tech_or_civic": "TECH_WRITING"}
                      self.snapshot = self.snapshot.model_copy(
                          update={
                              "tech_civics": {
                                  **self.snapshot.tech_civics,
                                  "current_research": "TECH_WRITING",
                                  "current_research_type": "TECH_WRITING",
                              }
                          }
                      )
                      return ActionResult(
                          success=True,
                          delivery_status=MutationDeliveryStatus.ACKNOWLEDGED,
                          details={"simulated": True},
                      )

                  async def end_turn(self, reflections=None):
                      self.call_count += 1
                      old_turn = self.snapshot.turn
                      self.mutations.append(
                          {
                              "kind": "end_turn",
                              "from_turn": old_turn,
                              "reflections": reflections,
                          }
                      )
                      self.snapshot = self.snapshot.model_copy(
                          update={
                              "turn": old_turn + 1,
                              "overview": {
                                  **self.snapshot.overview,
                                  "turn": old_turn + 1,
                              },
                          }
                      )
                      return ActionResult(
                          success=True,
                          delivery_status=MutationDeliveryStatus.ACKNOWLEDGED,
                          details={"simulated": True},
                      )

              game = SimulatedGame(proposal.game_session_id)
              game.snapshot = helpers["_research_ready_game"](
                  proposal.game_session_id
              ).snapshot
              engine = helpers["_engine"](store, game, helpers["_Planner"]())
              engine.config.execution_mode = ExecutionMode.AUTO
              engine.config.auto_end_turn = True

              results = []
              for index in range(1, 5):
                  result = await engine.tick()
                  results.append(
                      {
                          "runtime_tick": index,
                          "observed_turn": result.turn,
                          "outcome": None
                          if result.workflow_tick is None
                          else result.workflow_tick.get("outcome"),
                          "runtime_state": result.runtime_state,
                          "executed_task_ids": result.executed_task_ids,
                          "turn_ended": result.turn_ended,
                          "paused": result.paused,
                          "mutation_count": result.metrics.mutation_count,
                      }
                  )

              outcomes = [item["outcome"] for item in results]
              expected = [
                  "MUTATION_SENT",
                  "ATTEMPT_RECONCILED",
                  "TURN_TRANSITION_STARTED",
                  "TURN_TRANSITION_CONFIRMED",
              ]
              assert outcomes == expected, (outcomes, results)
              assert game.snapshot.turn == 2
              assert [
                  item["action_type"]
                  for item in game.mutations
                  if item["kind"] == "task"
              ] == ["set_research"]
              assert sum(item["kind"] == "end_turn" for item in game.mutations) == 1
              assert all(item["mutation_count"] <= 1 for item in results)

              contract = store.get_active_strategic_contract(proposal.game_session_id)
              attempts = store.list_action_attempts(proposal.game_session_id)
              tasks = store.list_tasks(proposal.game_session_id)
              report = {
                  "source_head": "c2f56f0bca007bc0aadc466abedff4531688a8e7",
                  "initial_proposal_id": proposal.proposal_id,
                  "proposal_application_tick": type(applied).__name__,
                  "runtime_ticks": results,
                  "mutations": game.mutations,
                  "final_game_turn": game.snapshot.turn,
                  "final_runtime_state": store.load_runtime_state(
                      proposal.game_session_id
                  ).value,
                  "active_contract_revision": None
                  if contract is None
                  else contract.revision,
                  "mission_statuses": {}
                  if contract is None
                  else {
                      mission.mission_id: mission.status.value
                      for mission in contract.mission_graph.missions
                  },
                  "attempts": [
                      {
                          "action_type": attempt.action_type,
                          "status": attempt.status.value,
                          "verification_status": None
                          if attempt.verification_status is None
                          else attempt.verification_status.value,
                          "verification_count": attempt.verification_count,
                      }
                      for attempt in attempts
                  ],
                  "tasks": [
                      {
                          "action_type": task.action_type,
                          "status": task.status.value,
                      }
                      for task in tasks
                  ],
              }
              Path("runtime-flow-audit.json").write_text(
                  json.dumps(report, ensure_ascii=False, indent=2, default=str),
                  encoding="utf-8",
              )
              print("RUNTIME_FLOW_AUDIT_BEGIN")
              print(json.dumps(report, ensure_ascii=False, indent=2, default=str))
              print("RUNTIME_FLOW_AUDIT_END")

          asyncio.run(scenario())
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: runtime-flow-audit
          path: runtime-flow-audit.json
          if-no-files-found: error

      - name: Persist evidence and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/runtime-flow-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-flow-audit.json .github/workflows/runtime-flow-audit.yml
          git commit -m "test: record isolated one-turn runtime audit"
          git push origin HEAD:agent/runtime-flow-audit-20260805
