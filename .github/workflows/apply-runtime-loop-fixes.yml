name: Materialize validated runtime loop fixes

on:
  push:
    branches:
      - codex/fix-runtime-convergence-gaps

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: codex/fix-runtime-convergence-gaps
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply reviewed patch
        shell: bash
        run: |
          git fetch origin agent/runtime-loop-fixes:refs/remotes/origin/agent/runtime-loop-fixes
          for script in \
            scripts/apply_runtime_loop_patch.py \
            scripts/refine_runtime_loop_tests.py \
            scripts/refine_runtime_loop_imports.py
          do
            git show "origin/agent/runtime-loop-fixes:${script}" > "/tmp/$(basename "${script}")"
            python "/tmp/$(basename "${script}")"
          done

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff

      - name: Validate focused fixes
        run: |
          python -m pytest tests/test_runtime_loop_closure.py tests/test_state_delta.py tests/test_phase7_runtime_convergence.py -q
          python -m compileall -q src tests/test_runtime_loop_closure.py
          python -m ruff check \
            src/civ6_workflow/runtime.py \
            src/civ6_workflow/planner_lifecycle.py \
            src/civ6_workflow/domain/state_delta.py \
            tests/test_runtime_loop_closure.py
          git diff --check

      - name: Package validated files
        run: |
          mkdir -p runtime-loop-fix/src/civ6_workflow/domain runtime-loop-fix/tests
          cp src/civ6_workflow/runtime.py runtime-loop-fix/src/civ6_workflow/runtime.py
          cp src/civ6_workflow/planner_lifecycle.py runtime-loop-fix/src/civ6_workflow/planner_lifecycle.py
          cp src/civ6_workflow/domain/state_delta.py runtime-loop-fix/src/civ6_workflow/domain/state_delta.py
          cp tests/test_runtime_loop_closure.py runtime-loop-fix/tests/test_runtime_loop_closure.py
          git diff --binary -- \
            src/civ6_workflow/runtime.py \
            src/civ6_workflow/planner_lifecycle.py \
            src/civ6_workflow/domain/state_delta.py \
            tests/test_runtime_loop_closure.py \
            > runtime-loop-fix/runtime-loop-fix.patch

      - name: Upload validated files
        uses: actions/upload-artifact@v4
        with:
          name: runtime-loop-fix-files
          path: runtime-loop-fix/
          if-no-files-found: error

      - name: Commit validated repair
        shell: bash
        run: |
          rm .github/workflows/apply-runtime-loop-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            src/civ6_workflow/runtime.py \
            src/civ6_workflow/planner_lifecycle.py \
            src/civ6_workflow/domain/state_delta.py \
            tests/test_runtime_loop_closure.py \
            .github/workflows/apply-runtime-loop-fixes.yml
          git commit -m "fix: close game runtime loop hazards"

      - name: Push validated commit to staging branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/agent/runtime-loop-staged
