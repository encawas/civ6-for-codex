name: Runtime loop patch source

on:
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Expose patch loader
        run: |
          python - <<'PY'
          import subprocess

          code = subprocess.check_output(
              [
                  "git",
                  "show",
                  "origin/agent/runtime-loop-fixes:scripts/apply_runtime_loop_patch.py",
              ],
              text=True,
          )
          exec(compile(code, "scripts/apply_runtime_loop_patch.py", "exec"))
          PY
