name: Runtime loop patch source

on:
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Expose patch loader
        run: |
          python - <<'PY'
          import subprocess

          for path in (
              "scripts/apply_runtime_loop_patch.py",
              "scripts/refine_runtime_loop_tests.py",
          ):
              code = subprocess.check_output(
                  [
                      "git",
                      "show",
                      f"origin/agent/runtime-loop-fixes:{path}",
                  ],
                  text=True,
              )
              exec(compile(code, path, "exec"))
          PY
