name: Build runtime loop repair artifact

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref == 'codex/fix-runtime-convergence-gaps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-runtime-convergence-gaps
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply reviewed patch
        shell: bash
        run: |
          git fetch origin agent/runtime-loop-fixes
          for script in \
            scripts/apply_runtime_loop_patch.py \
            scripts/refine_runtime_loop_tests.py \
            scripts/refine_runtime_loop_imports.py
          do
            git show "origin/agent/runtime-loop-fixes:${script}" > "/tmp/$(basename "${script}")"
            python "/tmp/$(basename "${script}")"
          done

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff

      - name: Validate focused fixes
        run: |
          python -m pytest tests/test_runtime_loop_closure.py tests/test_state_delta.py tests/test_phase7_runtime_convergence.py -q
          python -m compileall -q src tests
          python -m ruff check src/civ6_workflow tests/test_runtime_loop_closure.py

      - name: Package validated files
        uses: actions/upload-artifact@v4
        with:
          name: runtime-loop-patched-files
          path: |
            src/civ6_workflow/runtime.py
            src/civ6_workflow/planner_lifecycle.py
            src/civ6_workflow/domain/state_delta.py
            tests/test_runtime_loop_closure.py
          if-no-files-found: error
