name: Finalize runtime loop regression expectation

on:
  pull_request:
    branches:
      - codex/phase7-runtime-convergence
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: codex/fix-runtime-convergence-gaps
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update existing regression expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_strategic_research_proposals.py")
          text = path.read_text(encoding="utf-8")
          old = '        assert budget_blocked.workflow_tick["outcome"] == TickOutcomeKind.NO_SAFE_ACTION\n'
          new = '        assert budget_blocked.workflow_tick["outcome"] == TickOutcomeKind.AWAITING_HUMAN\n'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one legacy assertion, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Install and validate affected regressions
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q \
            tests/test_runtime_loop_closure.py \
            tests/test_strategic_research_proposals.py::test_multi_scope_delta_repairs_each_scope_before_accepting_baseline
          python -m compileall -q src tests/test_runtime_loop_closure.py tests/test_strategic_research_proposals.py
          git diff --check

      - name: Commit finalized repair
        shell: bash
        run: |
          rm .github/workflows/finalize-runtime-loop-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            tests/test_strategic_research_proposals.py \
            .github/workflows/finalize-runtime-loop-fix.yml
          git commit -m "test: align repair budget closure expectation"

      - name: Push finalized commit to staging branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/agent/runtime-loop-final
